- type: entity
  id: BaseTeleporterUpgrade
  parent: [ SmallConstructibleMachine, BaseMachinePowered ]
  name: Abstract Teleporter Upgrade
  description: Abstractly upgrading your teleporters since 2599.
  abstract: true
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Appearance
  - type: WiresPanel
  - type: Sprite
    sprite: Structures/Machines/teleframe_upgrades.rsi
    noRot: true
    layers:
    - state: base
    - state: base_powered
      shader: unshaded
      map: ["powerLight"]
    - state: base_opened
      map: ["enum.WiresVisuals.MaintenancePanel"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        powerLight:
          True: { visible: true }
          False: { visible: false }
        active:
          True: { visible: true }
          False: { visible: false }
        connectedLight:
          True: { visible: true }
          False: { visible: false }
      enum.WiresVisuals.MaintenancePanelState:
        enum.WiresVisualLayers.MaintenancePanel:
          True: { visible: true }
          False: { visible: false } #add teleframe upgrade visuals
  # - type: AdjacentUpgrade
  # - type: TeleframeUpgrade

- type: entity
  id: TeleportUpgradeAI
  parent: BaseTeleporterUpgrade
  name: teleframe AI integration server module
  description: A compact server array that allows the station's AI to directly control a teleframe and rapidly specify teleportation points at high reliability.
  components:
  - type: Sprite
    sprite: Structures/Machines/teleframe_upgrades.rsi
    noRot: true
    layers:
    - state: base
    - state: base_connected
      visible: false
      shader: unshaded
      map: ["connectedLight"]
    - state: base_powered
      visible: false
      shader: unshaded
      map: ["powerLight"]
    - state: base_opened
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: module_AI
    - state: module_AI_onlayer
      visible: false
      shader: unshaded
      map: ["active"]

- type: entity
  id: TeleportUpgradeDestabiliser
  parent: BaseTeleporterUpgrade
  name: teleframe destabiliser module
  description: A full suite of bluespace analysis tools to enhance the scientific study of teleportation by deliberately prompting instabilities. Makes the teleframe more unstable.
  components:
  - type: Sprite
    sprite: Structures/Machines/teleframe_upgrades.rsi
    noRot: true
    layers:
    - state: base
    - state: base_connected
      visible: false
      shader: unshaded
      map: ["connectedLight"]
    - state: base_powered
      visible: false
      shader: unshaded
      map: ["powerLight"]
    - state: base_opened
      visible: false
      map: ["enum.WiresVisualLayers.MaintenancePanel"]
    - state: module_destabiliser
    - state: module_destabiliser_on
      visible: false
      map: ["active"]
    - state: module_destabiliser_onlayer
      visible: false
      shader: unshaded
      map: ["active"]

